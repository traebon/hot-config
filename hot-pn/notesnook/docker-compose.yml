# NOTE: rendered and shown to Mr. Byrne for review, but not run through `docker compose` -- see
# the file-level note in the Nextcloud template for why (parsed directly, driven via dockerode).
# Adapted from the real, previously-working self-hosted stack this project ran on pn-test before
# it was decommissioned (hot-config: pn-test/notesnook/docker-compose.yml, commit f0920f3) --
# image names/service shape are proven, not guessed. Two real differences from that original:
#   1. Its `validate` service (a runtime env-var presence check) is dropped -- this system's own
#      preview-time field validation already guarantees required values are present before this
#      file is ever rendered, so a redundant runtime check added nothing.
#   2. The original didn't need cpuv1-tagged MinIO images (that was specific to the old EPYC 3151
#      Zen1 host) -- hot-pn's CPU genuinely supports AVX-512, confirmed live via /proc/cpuinfo, so
#      standard image tags are used here.
# Real bug found+fixed 2026-08-10 (first live deploy attempt): the 3 ASP.NET-based images
# (identity/sync/sse) all bake in ASPNETCORE_HTTP_PORTS=8080 as an image default (confirmed via
# `docker inspect .Config.Env`), which silently overrides the 8264/5264/7264 ports this template
# (and every service's own healthcheck) assumes. The original pn-test reference's published port
# mappings (e.g. "8264:8264") only ever worked because its own .env -- never committed to git, lost
# with the VM -- must have set this override; it isn't visible anywhere in the compose file itself.
# Fixed by setting ASPNETCORE_HTTP_PORTS explicitly per service below, rather than depending on an
# env var this template has no other record of.
x-server-discovery: &server-discovery
  NOTESNOOK_SERVER_PORT: 5264
  NOTESNOOK_SERVER_HOST: notesnook-sync
  IDENTITY_SERVER_PORT: 8264
  IDENTITY_SERVER_HOST: notesnook-identity
  SSE_SERVER_PORT: 7264
  SSE_SERVER_HOST: notesnook-sse
  SELF_HOSTED: 1
  IDENTITY_SERVER_URL: https://notes-auth.house-of-trae.com
  NOTESNOOK_APP_HOST: https://app.notesnook.com

services:
  notesnook-db:
    image: mongo:7.0
    container_name: notesnook-db
    restart: unless-stopped
    command: --replSet rs0 --bind_ip_all
    volumes:
      - ./db-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'try { rs.status() } catch (err) { rs.initiate() }; db.runCommand(\"ping\").ok' | mongosh mongodb://localhost:27017 --quiet"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  notesnook-s3:
    image: minio/minio:latest
    container_name: notesnook-s3
    restart: unless-stopped
    command: ["server", "/data/s3", "--console-address", ":9090"]
    environment:
      MINIO_ROOT_USER: eDRHPWVz4v2wwEntVW0Ixvo
      MINIO_ROOT_PASSWORD: FHmkHIBNyrqxmmMLFPVpnus
    volumes:
      - ./s3-data:/data/s3
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  notesnook-s3-setup:
    image: minio/mc:latest
    container_name: notesnook-s3-setup
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - "until mc alias set minio http://notesnook-s3:9000 eDRHPWVz4v2wwEntVW0Ixvo FHmkHIBNyrqxmmMLFPVpnus; do sleep 1; done; mc mb minio/attachments -p"
    depends_on:
      notesnook-s3:
        condition: service_healthy

  notesnook-identity:
    image: streetwriters/identity:latest
    container_name: notesnook-identity
    restart: unless-stopped
    depends_on:
      notesnook-db:
        condition: service_healthy
    environment:
      <<: *server-discovery
      ASPNETCORE_HTTP_PORTS: 8264
      MONGODB_CONNECTION_STRING: mongodb://notesnook-db:27017/identity?replSet=rs0
      MONGODB_DATABASE_NAME: identity
      INSTANCE_NAME: Notesnook
      NOTESNOOK_API_SECRET: mQG77SzDewGfoxvaT8N2Tc
      SMTP_USERNAME: notifications@house-of-trae.com
      SMTP_PASSWORD: uTsYD8dN1beobkH1iLIrXcy1FQeY
      SMTP_HOST: mail.house-of-trae.com
      SMTP_PORT: 587
      AUTH_SERVER_PUBLIC_URL: https://notes-auth.house-of-trae.com
      NOTESNOOK_APP_PUBLIC_URL: https://app.notesnook.com
      MONOGRAPH_PUBLIC_URL: https://notes-pub.house-of-trae.com
      ATTACHMENTS_SERVER_PUBLIC_URL: https://notes-s3.house-of-trae.com
    healthcheck:
      test: ["CMD-SHELL", "wget --tries=1 -nv -q http://localhost:8264/health -O- || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  notesnook-sync:
    image: streetwriters/notesnook-sync:latest
    container_name: notesnook-sync
    restart: unless-stopped
    depends_on:
      notesnook-s3:
        condition: service_healthy
      notesnook-identity:
        condition: service_healthy
    environment:
      <<: *server-discovery
      ASPNETCORE_HTTP_PORTS: 5264
      MONGODB_CONNECTION_STRING: mongodb://notesnook-db:27017/?replSet=rs0
      MONGODB_DATABASE_NAME: notesnook
      S3_INTERNAL_SERVICE_URL: http://notesnook-s3:9000
      S3_INTERNAL_BUCKET_NAME: attachments
      S3_ACCESS_KEY_ID: eDRHPWVz4v2wwEntVW0Ixvo
      S3_ACCESS_KEY: FHmkHIBNyrqxmmMLFPVpnus
      S3_SERVICE_URL: https://notes-s3.house-of-trae.com
      S3_REGION: us-east-1
      S3_BUCKET_NAME: attachments
    ports:
      - "127.0.0.1:23683:5264"
    healthcheck:
      test: ["CMD-SHELL", "wget --tries=1 -nv -q http://localhost:5264/health -O- || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  notesnook-sse:
    image: streetwriters/sse:latest
    container_name: notesnook-sse
    restart: unless-stopped
    depends_on:
      notesnook-identity:
        condition: service_healthy
      notesnook-sync:
        condition: service_healthy
    environment:
      <<: *server-discovery
      ASPNETCORE_HTTP_PORTS: 7264
    healthcheck:
      test: ["CMD-SHELL", "wget --tries=1 -nv -q http://localhost:7264/health -O- || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  notesnook-monograph:
    image: streetwriters/monograph:latest
    container_name: notesnook-monograph
    restart: unless-stopped
    depends_on:
      notesnook-sync:
        condition: service_healthy
    environment:
      <<: *server-discovery
      API_HOST: http://notesnook-sync:5264
      PUBLIC_URL: https://notes-pub.house-of-trae.com
    # No wget/curl in this Bun-based image, and its dev server only binds ::1 (IPv6 loopback), not
    # 127.0.0.1 -- "localhost" resolves to IPv4 first in-container, so a wget-style check against
    # "localhost" gets a silent connection refused despite the server being genuinely up. Found
    # 2026-08-10 via a real deploy: identity/sync/sse (ASP.NET, binds dual-stack) had no such issue
    # with the same wget+localhost pattern -- this is specific to this one image's runtime.
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://[::1]:3000/api/health\").then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
