<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namevault</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1.5rem; }
  h1 { font-size: 1.4rem; }
  input, button { font-size: 1rem; padding: 0.6rem 0.8rem; border-radius: 0.4rem; border: 1px solid #8888; }
  input { width: 100%; box-sizing: border-box; margin-bottom: 0.75rem; }
  button { cursor: pointer; }
  #result { margin-top: 1.5rem; font-size: 1.2rem; min-height: 1.5em; }
  #who { font-size: 0.85rem; opacity: 0.7; margin-bottom: 1.5rem; }
  a { color: inherit; }
</style>
</head>
<body>
  <h1>Namevault</h1>
  <div id="who">Loading…</div>
  <form id="f">
    <input id="name" placeholder="Real name" autocomplete="off" required>
    <button type="submit">Generate pseudonym</button>
  </form>
  <div id="result"></div>

<script>
async function me() {
  const r = await fetch('/api/me');
  const d = await r.json();
  const el = document.getElementById('who');
  if (d.logged_in) {
    el.innerHTML = `Signed in as ${d.name || d.email} &mdash; <a href="/auth/logout">log out</a>`;
  } else {
    el.innerHTML = `<a href="/auth/login">Log in</a> to save generated pseudonyms`;
  }
}
me();

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const out = document.getElementById('result');
  out.textContent = 'Generating…';
  try {
    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const d = await r.json();
    out.textContent = r.ok ? d.result : (d.error || 'Error');
  } catch {
    out.textContent = 'Request failed';
  }
});
</script>
</body>
</html>
