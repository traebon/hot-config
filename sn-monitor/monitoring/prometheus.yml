# ============================================================
# Prometheus Configuration
# Location: /opt/monitoring/prometheus/config/prometheus.yml
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'house-of-trae'

scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Gateway VPS — node exporter
  - job_name: 'gateway-node'
    static_configs:
      - targets: ['10.10.0.1:9100']
        labels:
          instance: 'gateway-vps'

  # sn-infra (VM 100)
  - job_name: 'sn-infra-node'
    static_configs:
      - targets: ['10.10.10.100:9100']
        labels:
          instance: 'sn-infra'

  # sn-web (VM 102)
  - job_name: 'sn-web-node'
    static_configs:
      - targets: ['10.10.30.102:9100']
        labels:
          instance: 'sn-web'

  # sn-monitor self (VM 104)
  - job_name: 'sn-monitor-node'
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ['10.10.50.104:9100']
        labels:
          instance: 'sn-monitor'

  # Proxmox host (hot-bm-nl)
  - job_name: 'proxmox-node'
    static_configs:
      - targets: ['10.10.50.1:9100']
        labels:
          instance: 'proxmox-host'

  # sn-security (VM 106)
  - job_name: 'sn-security-node'
    static_configs:
      - targets: ['10.10.70.106:9100']
        labels:
          instance: 'sn-security'

  # sn-business (VM 101), sn-personal (VM 103), pn-test (VM 105) are permanently retired —
  # those roles moved to hot-erp/hot-pn (2026-07-24 decision), VLANs 20/40/60 are not part of
  # the hot-bm-nl rebuild. sn-security (VM 106) not yet built — add its job back once it exists,
  # don't pre-declare a target for something that doesn't exist yet (matches this project's
  # standing practice of not fabricating monitoring state).

  # Blackbox Exporter — HTTPS/TLS probes for all public HoT endpoints
  - job_name: 'blackbox-https'
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://house-of-trae.com
          - https://securenexus.net
          - https://byrne-accounts.org
          - https://stratus-digital.com
          - https://discreet-elite.uk
          - https://emerald-markets.net
          - https://auth.house-of-trae.com
          - https://grafana.house-of-trae.com
          - https://status.house-of-trae.com
          - https://webmail.house-of-trae.com
          - https://git.securenexus.net
          - https://dns-admin.house-of-trae.com
          - https://namevault.co.uk
          - https://rubyosiris.com
          - https://evilrabbitart.com
          - https://dickson-supplies.com
          - https://ntfy.house-of-trae.com
          - https://vault.house-of-trae.com
          - https://wazuh.house-of-trae.com
          - https://erp.dickson-supplies.com
          - https://privatenexus.net
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
