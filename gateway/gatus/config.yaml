web:
  port: 8080

storage:
  type: memory

metrics: true

connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 60s

alerting:
  email:
    from: "notifications@house-of-trae.com"
    username: "notifications@house-of-trae.com"
    password: "${GATUS_SMTP_PASSWORD}"
    host: "mail.house-of-trae.com"
    port: 587
    to: "tristian@securenexus.net"

endpoints:
  - name: WireGuard Tunnel (hot-bm-nl)
    group: Infrastructure
    url: "icmp://10.10.3.2"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true
        description: "hot-bm-nl WireGuard tunnel (wg4) is DOWN -- affects sn-infra/sn-web/sn-monitor/sn-security"

  - name: Keycloak SSO
    group: Gateway
    url: "https://auth.house-of-trae.com/realms/master/.well-known/openid-configuration"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Caddy / TLS
    group: Gateway
    url: "https://house-of-trae.com"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Mailserver SMTP
    group: Gateway
    url: "tcp://151.241.217.91:25"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Mailserver Submission
    group: Gateway
    url: "tcp://151.241.217.91:587"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Ntfy
    group: Gateway
    url: "http://ntfy:80/v1/health"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Vaultwarden
    group: Gateway
    url: "http://vaultwarden:80/"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: CrowdSec LAPI
    group: Gateway
    url: "http://crowdsec:8080/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: ERPNext
    group: Services
    url: "https://erp.dickson-supplies.com"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Forgejo
    group: Services
    url: "https://git.securenexus.net"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Grafana
    group: Services
    # Root path redirects (302) to login, not 200 - found 2026-08-03 when this alerted
    # spuriously as "down" right after the real hot-bm-nl outage recovered. Use the real
    # health endpoint instead.
    url: "https://grafana.house-of-trae.com/api/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].database == \"ok\""
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Wazuh SIEM
    group: Services
    url: "https://wazuh.house-of-trae.com"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true
