web:
  port: 8080

storage:
  type: memory

metrics: true

connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 60s

alerting:
  email:
    from: "notifications@house-of-trae.com"
    username: "notifications@house-of-trae.com"
    password: "${GATUS_SMTP_PASSWORD}"
    host: "mail.house-of-trae.com"
    port: 587
    to: "tristian@securenexus.net"

endpoints:
  - name: WireGuard Tunnel (hot-bm-nl)
    group: Infrastructure
    url: "icmp://10.10.3.2"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true
        description: "hot-bm-nl WireGuard tunnel (wg4) is DOWN -- affects sn-infra/sn-web/sn-monitor/sn-security"

  - name: Keycloak SSO
    group: Gateway
    url: "https://auth.house-of-trae.com/realms/master/.well-known/openid-configuration"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Caddy / TLS
    group: Gateway
    url: "https://house-of-trae.com"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Mailserver SMTP
    group: Gateway
    url: "tcp://151.241.217.91:25"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Mailserver Submission
    group: Gateway
    url: "tcp://151.241.217.91:587"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Ntfy
    group: Gateway
    url: "http://ntfy:80/v1/health"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Vaultwarden
    group: Gateway
    url: "http://vaultwarden:80/"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: CrowdSec LAPI
    group: Gateway
    url: "http://crowdsec:8080/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: ERPNext
    group: Services
    url: "https://erp.dickson-supplies.com"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Forgejo
    group: Services
    url: "https://git.securenexus.net"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Grafana
    group: Services
    # Root path redirects (302) to login, not 200 - found 2026-08-03 when this alerted
    # spuriously as "down" right after the real hot-bm-nl outage recovered. Use the real
    # health endpoint instead.
    # [BODY].database == "ok" (JSON path equality) was found 2026-08-08 to fail on every
    # check but the very first one after a restart (1497 consecutive false results over 5
    # days), despite curl replicating the exact same request (same network, DNS, TLS/HTTP
    # version, headers) always returning the correct {"database":"ok",...} body — looks like
    # a quirk in this Gatus version's JSON-path comparator, not a real Grafana problem.
    # Switched to a raw-body pattern match, which sidesteps whatever's wrong with the JSON
    # path evaluator. See backup_architecture-adjacent gatus_grafana_check_bug memory.
    url: "https://grafana.house-of-trae.com/api/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*\"database\":*\"ok\"*)"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Wazuh SIEM
    group: Services
    url: "https://wazuh.house-of-trae.com"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  # Added 2026-08-17 -- closing a real gap found while scoping the edge load-balancing project
  # (docs/HoT_Edge_Load_Balancing_Scope.md): Gatus exists specifically to catch sn-monitor/
  # hot-bm-nl dying (Uptime Kuma can't alert on its own host's death), but until now it only
  # independently covered one service per VM (ERPNext/Forgejo/Grafana/Wazuh above) -- sn-web's 6
  # client sites and sn-infra's PowerDNS-Admin/Namevault had zero independent-of-hot-bm-nl health
  # signal at all, only Uptime Kuma (which dies with the same host). Confirmed real status codes
  # via curl before writing conditions, not guessed.

  - name: PowerDNS-Admin
    group: Services
    url: "https://dns-admin.house-of-trae.com"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Namevault
    group: Services
    url: "https://namevault.co.uk"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Prometheus
    group: Services
    # SSO-gated (import sso). Confirmed via curl (same network as this container) that the real,
    # healthy first-hop response is a 302 to /oauth2/start -- that redirect firing correctly IS
    # the healthy signal here (proves Caddy+oauth2-proxy+backend routing chain is alive). Needs
    # `client.ignore-redirect: true` or Gatus's Go HTTP client follows the redirect into the
    # stateless OAuth dance itself, which 400s without a real browser session/cookies -- found by
    # testing 2026-08-17, not assumed; without this the check permanently false-fails even though
    # the real endpoint is healthy the whole time (same class of bug as the Grafana root-redirect
    # and JSON-path issues documented above).
    url: "https://prometheus.house-of-trae.com"
    interval: 5m
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 302"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Stratus Digital
    group: sn-web Client Sites
    url: "https://stratus-digital.com"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Discreet Elite
    group: sn-web Client Sites
    url: "https://discreet-elite.uk"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Emerald Markets
    group: sn-web Client Sites
    url: "https://emerald-markets.net"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Ruby Osiris
    group: sn-web Client Sites
    url: "https://rubyosiris.com"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Evil Rabbit Art
    group: sn-web Client Sites
    url: "https://evilrabbitart.com"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true

  - name: Dickson Supplies (web)
    group: sn-web Client Sites
    url: "https://dickson-supplies.com"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 2
        success-threshold: 2
        send-on-resolved: true
