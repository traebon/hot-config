services:

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      TZ: Europe/London
      COLLECTIONS: "crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/linux"
      GID: "1000"
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - /var/log:/var/log/host:ro
      - caddy_data:/var/log/caddy:ro
      - /opt/stacks/mailserver/logs:/var/log/mailserver:ro
    ports:
      - "100.106.41.10:8082:8080"
      - "10.10.0.1:6060:6060"
      # LAPI on the WireGuard mesh, distinct port from the Tailscale-bound one
      # above -- for PrivateNexus's Security Lockdown Mode (hot-pn calling in
      # to add CrowdSec bans, real production automation traffic, not admin
      # traffic, so it belongs on the mesh not Tailscale). UFW scopes this to
      # hot-pn's tunnel IP only (10.10.2.2/32), not the whole 10.10.0.0/16 --
      # see PrivateNexus_Security_Lockdown_Mode_Design.md.
      - "10.10.0.1:8083:8080"
    networks:
      - hotinfra_edge

volumes:
  crowdsec_data:
    name: crowdsec_data
  crowdsec_config:
    name: crowdsec_config
  caddy_data:
    external: true

networks:
  hotinfra_edge:
    external: true
